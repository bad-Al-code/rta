services:
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - '4000:4000'
    env_file:
      - ./apps/analytics-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:alpine3.20
    container_name: analytics-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network

  postgres:
    image: postgres:17.5
    container_name: analytics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/data/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d analytics_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mongo:
    image: mongo:8.0
    container_name: analytics-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --host localhost --username root --password password --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  redis-data:
  postgres-data:
  mongo-data:

networks:
  app-network:
    driver: bridge
