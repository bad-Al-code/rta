apiVersion: v1
kind: ResourceQuota
metadata:
  name: database-quota
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 4Gi
    limits.cpu: '4'
    limits.memory: 8Gi
    persistentvolumeclaims: '10'
    pods: '20'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: database-limit-range
spec:
  limits:
    - max:
        cpu: '2'
        memory: 2Gi
      min:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      type: Container
