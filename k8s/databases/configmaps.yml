apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app: postgres
data:
  postgresql.conf: |
    max_connections = 100
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB

    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 80MB

    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 4MB

    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_statement = 'all'
    log_duration = on
    log_line_prefix = '%m [%p] %q%u@%d '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  labels:
    app: mongo
data:
  mongod.conf: |
    net:
      port: 27017
      bindIp: 0.0.0.0

    storage:
      dbPath: /data/db
      journal:
        enabled: true

    systemLog:
      destination: file
      path: /var/log/mongodb/mongod.log
      logAppend: true
      verbosity: 1

    security:
      authorization: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app: redis
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru

    appendonly yes
    appendfsync everysec

    loglevel notice

    timeout 300
    tcp-keepalive 60
