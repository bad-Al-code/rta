apiVersion: v1
kind: ConfigMap
metadata:
  name: app-configmap
  labels:
    app: analytics-service
    tier: application
data:
  NODE_ENV: 'production'
  PORT: '4000'
  JWT_EXPIRES_IN: '30d'
  JWT_REFRESH_EXPIRES_IN: '90d'
  DATABASE_URL: 'postgresql://postgres:postgres@postgres-service:5432/analytics_db'
  MONGO_URL: 'mongodb://root:password@mongo-service:27017/analytics_db?authSource=admin'
  REDIS_URL: 'redis://redis-service:6379'
  DATABASE_POOL_MIN: '2'
  DATABASE_POOL_MAX: '10'
  DATABASE_IDLE_TIMEOUT: '10000'
  DATABASE_CONNECTION_TIMEOUT: '5000'
  MONGO_POOL_SIZE: '10'
  MONGO_CONNECT_TIMEOUT: '10000'
  MONGO_SOCKET_TIMEOUT: '45000'
  MONGO_SERVER_SELECTION_TIMEOUT: '5000'
  REDIS_CONNECT_TIMEOUT: '5000'
  REDIS_COMMAND_TIMEOUT: '5000'
  REDIS_MAX_RETRIES: '3'
  REDIS_RETRY_DELAY: '1000'
  API_VERSION: 'v1'
  API_PREFIX: '/api/v1'
  ENABLE_API_DOCS: 'false'
  RATE_LIMIT_WINDOW_MS: '900000'
  RATE_LIMIT_MAX_REQUESTS: '100'
  CORS_ORIGIN: '*'
  CORS_CREDENTIALS: 'true'
  REQUEST_BODY_LIMIT: '10mb'
  REQUEST_PARAM_LIMIT: '1000'
  HEALTH_CHECK_PATH: '/api/v1/health'
  HEALTH_CHECK_INTERVAL: '30000'
  SHUTDOWN_TIMEOUT: '15000'
  TZ: 'UTC'
