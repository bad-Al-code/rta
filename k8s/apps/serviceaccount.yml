apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service-sa
  labels:
    app: analytics-service
    tier: application
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analytics-service-role
  labels:
    app: analytics-service
    tier: application
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analytics-service-rolebinding
  labels:
    app: analytics-service
    tier: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analytics-service-role
subjects:
  - kind: ServiceAccount
    name: analytics-service-sa
    namespace: default
