apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: "15s"
          queryTimeout: "60s"
          httpMethod: "POST"
        editable: true

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: Prometheus
              matcherRegex: "traceID=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true

  analytics-service-dashboard.json: |
    {
      "dashboard": {
        "title": "Analytics Service Dashboard",
        "tags": ["analytics", "application"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total{app=\"analytics-service\"}[5m])",
                "legendFormat": "{{method}} {{route}}"
              }
            ],
            "type": "graph"
          },
          {
            "id": 2,
            "title": "Response Time (95th percentile)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{app=\"analytics-service\"}[5m]))",
                "legendFormat": "{{route}}"
              }
            ],
            "type": "graph"
          },
          {
            "id": 3,
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total{app=\"analytics-service\",status_code=~\"5..\"}[5m])",
                "legendFormat": "{{status_code}}"
              }
            ],
            "type": "graph"
          },
          {
            "id": 4,
            "title": "CPU Usage",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{pod=~\"analytics-service.*\"}[5m])",
                "legendFormat": "{{pod}}"
              }
            ],
            "type": "graph"
          },
          {
            "id": 5,
            "title": "Memory Usage",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"analytics-service.*\"}",
                "legendFormat": "{{pod}}"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }

  kubernetes-dashboard.json: |
    {
      "dashboard": {
        "title": "Kubernetes Cluster Overview",
        "tags": ["kubernetes", "cluster"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Cluster CPU Usage",
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total[5m]))",
                "legendFormat": "CPU Usage"
              }
            ],
            "type": "graph"
          },
          {
            "id": 2,
            "title": "Cluster Memory Usage",
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes)",
                "legendFormat": "Memory Usage"
              }
            ],
            "type": "graph"
          },
          {
            "id": 3,
            "title": "Pod Status",
            "targets": [
              {
                "expr": "kube_pod_status_phase",
                "legendFormat": "{{phase}}"
              }
            ],
            "type": "stat"
          }
        ]
      }
    }

  database-dashboard.json: |
    {
      "dashboard": {
        "title": "Database Metrics Dashboard",
        "tags": ["database", "postgresql", "mongodb", "redis"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "PostgreSQL Connections",
            "targets": [
              {
                "expr": "pg_stat_database_numbackends",
                "legendFormat": "{{datname}}"
              }
            ],
            "type": "graph"
          },
          {
            "id": 2,
            "title": "PostgreSQL Query Duration",
            "targets": [
              {
                "expr": "rate(pg_stat_statements_mean_time_seconds[5m])",
                "legendFormat": "Mean Query Time"
              }
            ],
            "type": "graph"
          },
          {
            "id": 3,
            "title": "MongoDB Operations",
            "targets": [
              {
                "expr": "rate(mongodb_op_counters_total[5m])",
                "legendFormat": "{{type}}"
              }
            ],
            "type": "graph"
          },
          {
            "id": 4,
            "title": "Redis Commands/sec",
            "targets": [
              {
                "expr": "rate(redis_commands_processed_total[5m])",
                "legendFormat": "Commands"
              }
            ],
            "type": "graph"
          },
          {
            "id": 5,
            "title": "Redis Memory Usage",
            "targets": [
              {
                "expr": "redis_memory_used_bytes",
                "legendFormat": "Memory Used"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
